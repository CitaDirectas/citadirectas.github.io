<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar cita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-color: #1F3A5F;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }
  .tarjeta {
    background: rgba(255,255,255,0.95);
    max-width: 440px;
    width: 92%;
    margin: 0 auto;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  h1 { font-size: 22px; margin-top:0; color:#1F3A5F; }
  label { display:block; margin-top:14px; font-weight:bold; font-size:14px; }
  input, select { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; font-size:15px; }
  button { margin-top:20px; width:100%; padding:12px; background:#1F3A5F; color:#fff; border:none; border-radius:4px; font-size:16px; cursor:pointer; }
  .btn-calendario { background:#2E7D32; margin-top:10px; }
  #mensaje { margin-top:16px; font-weight:bold; }
  #confirmacion { display:none; }
  #errorNegocio { display:none; text-align:center; color:#B02A2A; font-weight:bold; }
</style>
</head>
<body id="body">
<div class="tarjeta">
  <div id="errorNegocio">No se ha encontrado este negocio. Revisa el enlace o el codigo QR.</div>
  <div id="contenido">
    <h1 id="tituloNegocio">Reservar cita</h1>

    <form id="formReserva">
      <label>Nombre y apellidos</label>
      <input type="text" id="nombre" required>
      <label>Telefono (9 digitos)</label>
      <input type="tel" id="telefono" required pattern="[0-9]{9}">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Servicio</label>
      <select id="servicio" required></select>
      <div id="camposExtra"></div>
      <label>Fecha</label>
      <input type="date" id="fecha" required>
      <label>Hora</label>
      <select id="hora" required></select>
      <button type="submit">Reservar</button>
    </form>

    <div id="mensaje"></div>

    <div id="confirmacion">
      <p>Tu cita ha sido confirmada. Anadela a tu calendario para recibir el aviso (1 dia antes y 2 horas antes):</p>
      <button class="btn-calendario" id="btnIcsCal">Anadir a mi calendario (con recordatorios)</button>
      <button class="btn-calendario" id="btnGoogleCal">Abrir directo en Google Calendar</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://ggnjqjwasybbhosnjomk.supabase.co";
  var SUPABASE_ANON_KEY =sb_publishable_cLZ44Bj1DDz6gfFn1LEcqQ_w08vUwNh;
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var params = new URLSearchParams(window.location.search);
  var slugNegocio = params.get("negocio");
  var negocio = null;

  function mostrarErrorNegocio() {
    document.getElementById("errorNegocio").style.display = "block";
    document.getElementById("contenido").style.display = "none";
  }

  function cargarNegocio() {
    if (!slugNegocio) {
      mostrarErrorNegocio();
      return Promise.resolve(false);
    }
    return client.from("negocio_publico").select("*").eq("slug", slugNegocio).single().then(function(resp) {
      if (resp.error || !resp.data) {
        mostrarErrorNegocio();
        return false;
      }
      negocio = resp.data;
      document.getElementById("tituloNegocio").textContent = negocio.nombre_negocio || "Reservar cita";
      document.title = negocio.nombre_negocio || "Reservar cita";
      if (negocio.foto_fondo) {
        document.getElementById("body").style.backgroundImage = "url(" + JSON.stringify(negocio.foto_fondo) + ")";
      }
      return true;
    });
  }

  function cargarServicios() {
    return client.from("SERVICIO").select("id, nombre, precio, duracion").eq("negocio_id", negocio.id).then(function(resp) {
      var select = document.getElementById("servicio");
      if (resp.error || !resp.data) {
        select.innerHTML = "<option value=\"\">No se pudieron cargar los servicios</option>";
        return;
      }
      var html = "";
      for (var i = 0; i < resp.data.length; i++) {
        var s = resp.data[i];
        var duracion = s.duracion || 60;
        html += "<option value=\"" + s.id + "\" data-duracion=\"" + duracion + "\" data-nombre=\"" + s.nombre + "\">" + s.nombre + " - " + s.precio + " EUR (" + duracion + " min)</option>";
      }
      select.innerHTML = html;
    });
  }

  function cargarCamposExtra() {
    return client.from("CAMPOS_FORMULARIO").select("*").eq("negocio_id", negocio.id).order("orden").then(function(resp) {
      var contenedor = document.getElementById("camposExtra");
      if (resp.error || !resp.data) {
        contenedor.innerHTML = "";
        return;
      }
      var html = "";
      for (var i = 0; i < resp.data.length; i++) {
        var c = resp.data[i];
        var tipoInput = c.tipo === "telefono" ? "tel" : (c.tipo === "numero" ? "number" : "text");
        var req = c.obligatorio ? "required" : "";
        html += "<label>" + c.etiqueta + "</label><input type=\"" + tipoInput + "\" data-campo=\"" + c.campo + "\" class=\"campo-extra\" " + req + ">";
      }
      contenedor.innerHTML = html;
    });
  }

  function cargarHoras() {
    var select = document.getElementById("hora");
    var inicio = negocio.horario_inicio || 8;
    var fin = negocio.horario_fin || 20;
    var opciones = "";
    for (var m = inicio * 60; m < fin * 60; m += 30) {
      var hh = String(Math.floor(m / 60)).padStart(2, "0");
      var mm = String(m % 60).padStart(2, "0");
      opciones += "<option value=\"" + hh + ":" + mm + "\">" + hh + ":" + mm + "</option>";
    }
    select.innerHTML = opciones;
  }

  function iniciar() {
    cargarNegocio().then(function(ok) {
      if (!ok) { return; }
      return Promise.all([cargarServicios(), cargarCamposExtra()]).then(function() {
        cargarHoras();
      });
    });
  }
  iniciar();

  function pad(n) { return String(n).padStart(2, "0"); }
  function formatoUTC(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
  }

  function generarICS(titulo, inicio, duracionMinutos) {
    var fin = new Date(inicio.getTime() + duracionMinutos * 60000);
    var lineas = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "BEGIN:VEVENT",
      "UID:" + Date.now() + "@reservas",
      "DTSTAMP:" + formatoUTC(new Date()),
      "DTSTART:" + formatoUTC(inicio),
      "DTEND:" + formatoUTC(fin),
      "SUMMARY:" + titulo,
      "BEGIN:VALARM",
      "TRIGGER:-P1D",
      "ACTION:DISPLAY",
      "DESCRIPTION:Recordatorio de cita (1 dia antes)",
      "END:VALARM",
      "BEGIN:VALARM",
      "TRIGGER:-PT2H",
      "ACTION:DISPLAY",
      "DESCRIPTION:Recordatorio de cita (2 horas antes)",
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR"
    ];
    return lineas.join("\r\n");
  }

  document.getElementById("formReserva").addEventListener("submit", function(e) {
    e.preventDefault();
    var mensaje = document.getElementById("mensaje");
    mensaje.style.color = "#222";
    mensaje.textContent = "Enviando...";

    var nombre = document.getElementById("nombre").value.trim();
    var telefono = document.getElementById("telefono").value.trim();
    var email = document.getElementById("email").value.trim();
    var servicioSelect = document.getElementById("servicio");
    var servicioId = servicioSelect.value;
    var opcionServicio = servicioSelect.selectedOptions[0];
    var duracion = opcionServicio ? Number(opcionServicio.getAttribute("data-duracion")) : 60;
    var nombreServicio = opcionServicio ? opcionServicio.getAttribute("data-nombre") : "Cita";
    var fecha = document.getElementById("fecha").value;
    var hora = document.getElementById("hora").value;
    var fechaHora = fecha + " " + hora + ":00";

    var datosExtra = {};
    var camposExtra = document.querySelectorAll(".campo-extra");
    for (var i = 0; i < camposExtra.length; i++) {
      var input = camposExtra[i];
      datosExtra[input.getAttribute("data-campo")] = input.value.trim();
    }

    client.from("CITAS").insert([{
      negocio_id: negocio.id,
      nombre_cliente: nombre,
      telefono: telefono,
      email: email,
      servicio_id: servicioId,
      fecha_hora: fechaHora,
      datos_extra: datosExtra
    }]).then(function(resp) {
      if (resp.error) {
        mensaje.style.color = "#B02A2A";
        mensaje.textContent = "No hay disponibilidad para esa hora. Prueba con otra franja.";
        return;
      }

      mensaje.style.color = "#2E7D32";
      mensaje.textContent = "Cita reservada correctamente!";
      document.getElementById("formReserva").style.display = "none";
      document.getElementById("confirmacion").style.display = "block";

      var inicioDate = new Date(fecha + "T" + hora + ":00");
      var tituloEvento = nombreServicio + " - " + (negocio.nombre_negocio || "Cita");

      document.getElementById("btnIcsCal").onclick = function() {
        var ics = generarICS(tituloEvento, inicioDate, duracion);
        var blob = new Blob([ics], { type: "text/calendar" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "cita.ics";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      document.getElementById("btnGoogleCal").onclick = function() {
        var finDate = new Date(inicioDate.getTime() + duracion * 60000);
        var url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" +
          encodeURIComponent(tituloEvento) + "&dates=" + formatoUTC(inicioDate) + "/" + formatoUTC(finDate);
        window.open(url, "_blank");
      };
    });
  });
</script>
</body>
</html>
